<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Depo Hindsight{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
  <div class="container">
    <div class="nav-logo"><a href="/">Depo <span>Hindsight</span></a></div>
    <div class="nav-links" id="navLinks">
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        {% if is_admin %}<a href="{{ url_for('admin_panel') }}">Admin</a>{% endif %}
        <a href="{{ url_for('logout') }}">Log out</a>
      {% else %}
        <a href="/#features">Features</a>
        <a href="/#how-it-works">How it works</a>
        <a href="{{ url_for('pricing') }}">Pricing</a>
        <a href="{{ url_for('login') }}" class="nav-cta">Sign in</a>
      {% endif %}
    </div>
    <div class="hamburger" id="hamburger" onclick="this.classList.toggle('open');document.getElementById('navLinks').classList.toggle('open');">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer>
  <div class="container">
    <p>&copy; 2026 Depo Hindsight. All rights reserved.</p>
    <p style="margin-top: 0.5rem;"><a href="/">depohindsight.com</a></p>
  </div>
</footer>

<script>
document.querySelectorAll('#navLinks a').forEach(function(a){
  a.addEventListener('click',function(){
    document.getElementById('navLinks').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
  });
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
